services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: finpilot-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0

  # 2. Frontend Static Site
  - type: web
    name: finpilot-frontend
    env: static
    buildCommand: ""
    staticPublishPath: .
